name: Hongik Job Alarm

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 가상 모니터 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 라이브러리 설치
        run: |
          pip install requests beautifulsoup4 python-telegram-bot geopy selenium webdriver-manager undetected-chromedriver pyvirtualdisplay

      - name: 크롤링 코드 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HONGIK_ID: ${{ secrets.HONGIK_ID }}
          HONGIK_PW: ${{ secrets.HONGIK_PW }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # ✅ [추가됨] 주소와 좌표도 비밀 금고에서 가져옵니다!
          MY_HOME_ADDRESS: ${{ secrets.MY_HOME_ADDRESS }}
          MY_HOME_COORDS: ${{ secrets.MY_HOME_COORDS }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: 스크린샷 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 1
      
      - name: 결과 텍스트 저장
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sent_posts.txt
          git commit -m "Update sent posts" || exit 0
          git pull origin main --rebase
          git push
