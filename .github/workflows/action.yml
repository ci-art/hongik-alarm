name: Hongik Job Alarm

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 가상 모니터 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 라이브러리 설치
        run: |
          pip install requests beautifulsoup4 python-telegram-bot geopy selenium webdriver-manager undetected-chromedriver pyvirtualdisplay

      - name: 크롤링 코드 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HONGIK_ID: ${{ secrets.HONGIK_ID }}
          HONGIK_PW: ${{ secrets.HONGIK_PW }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: 스크린샷 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 1
      
      - name: 결과 텍스트 저장
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # ✅ [수정된 순서]
          # 1. 봇이 작업한 내용을 먼저 '임시 저장(Commit)' 합니다.
          git add sent_posts.txt
          git commit -m "Update sent posts" || exit 0
          
          # 2. 그 상태에서 최신 파일을 받아와서 합칩니다(Rebase).
          git pull origin main --rebase
          
          # 3. 합쳐진 결과를 최종 업로드(Push) 합니다.
          git push
