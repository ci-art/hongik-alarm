name: Hongik Job Alarm

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: |
          # undetected-chromedriver 추가됨
          pip install requests beautifulsoup4 python-telegram-bot geopy selenium webdriver-manager undetected-chromedriver

      - name: 크롤링 코드 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HONGIK_ID: ${{ secrets.HONGIK_ID }}
          HONGIK_PW: ${{ secrets.HONGIK_PW }}
        run: |
          python main.py

      - name: 스크린샷 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 1
      
      - name: 결과 텍스트 저장
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          touch sent_posts.txt
          git add sent_posts.txt
          git commit -m "Update sent posts" || exit 0
          git push
